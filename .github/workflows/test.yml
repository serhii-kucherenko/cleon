name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows
    steps:
      - uses: actions/checkout@v5
      - name: Scripts parse
        run: for f in bin/cleon hooks/cleon-swap.sh install.sh tests/smoke.sh demo/setup.sh; do bash -n "$f"; done
      - name: Smoke test
        run: bash tests/smoke.sh
